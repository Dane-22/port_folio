<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keycap Interaction Demo</title>
    <style>
        body {
            background-color: #0f172a; /* Slate 900 for dark mode */
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            gap: 4rem;
            margin-top: 2rem;
        }

        .demo-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            width: 200px;
        }

        /* Base Keycap Styles */
        .keycap {
            position: relative;
            width: 80px;
            height: 80px;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #c4b5fd;
            cursor: pointer;
            user-select: none;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 
                inset 0 4px 6px rgba(255, 255, 255, 0.1),
                inset 0 -4px 6px rgba(0, 0, 0, 0.4),
                0 10px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.1s ease;
        }

        /* --- Option A: Mechanical Switch --- */
        .keycap.mechanical:active, .keycap.mechanical.pressed {
            transform: translateY(6px) scale(0.95);
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.1),
                inset 0 -1px 2px rgba(0, 0, 0, 0.4),
                0 2px 4px rgba(0, 0, 0, 0.3);
        }
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.6);
            transform: scale(0);
            animation: ripple-anim 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple-anim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* --- Option B: Glitch --- */
        .keycap.glitch {
            transition: transform 0.1s;
        }
        .keycap.glitch.glitching {
            animation: glitch-anim 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
            color: transparent;
            text-shadow: 2px 0 red, -2px 0 cyan;
        }
        @keyframes glitch-anim {
            0% { transform: translate(0) skew(0); }
            20% { transform: translate(-5px, 5px) skew(10deg); }
            40% { transform: translate(5px, -5px) skew(-10deg); }
            60% { transform: translate(-5px, -5px) skew(5deg); }
            80% { transform: translate(5px, 5px) skew(-5deg); }
            100% { transform: translate(0) skew(0); }
        }
        .binary-particle {
            position: absolute;
            color: #10b981;
            font-family: monospace;
            font-size: 1.2rem;
            pointer-events: none;
            animation: float-up 1s ease-out forwards;
        }
        @keyframes float-up {
            to {
                transform: translateY(-50px) scale(1.5);
                opacity: 0;
            }
        }

        /* --- Option C: Typewriter Drop --- */
        .keycap.typewriter:active, .keycap.typewriter.pressed {
            transform: translateY(4px);
        }
        .dropped-symbol {
            position: absolute;
            color: #c4b5fd;
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
            animation: drop-down 1.5s ease-in forwards;
        }
        @keyframes drop-down {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            20% { transform: translateY(-20px) rotate(10deg); }
            100% { transform: translateY(200px) rotate(45deg); opacity: 0; }
        }

    </style>
</head>
<body>
    <h2>Click the keycaps to test the effects</h2>
    <div class="container">
        
        <!-- Option A -->
        <div class="demo-column">
            <h3>A: Mechanical</h3>
            <div class="keycap mechanical" id="btn-a" onclick="triggerMechanical(event)">
                { }
            </div>
            <p style="text-align: center; color: #94a3b8; font-size: 0.9rem;">Presses down physically and emits an RGB ripple.</p>
        </div>

        <!-- Option B -->
        <div class="demo-column">
            <h3>B: Glitch</h3>
            <div class="keycap glitch" id="btn-b" onclick="triggerGlitch(event)">
                Esc
            </div>
            <p style="text-align: center; color: #94a3b8; font-size: 0.9rem;">Glitches out and emits binary code 1s and 0s.</p>
        </div>

        <!-- Option C -->
        <div class="demo-column">
            <h3>C: Drop</h3>
            <div class="keycap typewriter" id="btn-c" onclick="triggerTypewriter(event)">
                Ctrl
            </div>
            <p style="text-align: center; color: #94a3b8; font-size: 0.9rem;">Physically drops a copy of its symbol downward.</p>
        </div>

    </div>

    <script>
        function triggerMechanical(e) {
            const btn = e.currentTarget;
            
            // Add ripple
            const ripple = document.createElement('div');
            ripple.classList.add('ripple');
            // Size based on button
            const diameter = Math.max(btn.clientWidth, btn.clientHeight);
            const radius = diameter / 2;
            ripple.style.width = ripple.style.height = `${diameter}px`;
            ripple.style.left = `${e.clientX - btn.getBoundingClientRect().left - radius}px`;
            ripple.style.top = `${e.clientY - btn.getBoundingClientRect().top - radius}px`;
            
            btn.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }

        function triggerGlitch(e) {
            const btn = e.currentTarget;
            btn.classList.add('glitching');
            
            // Spawn binary particles
            for(let i=0; i<5; i++) {
                const particle = document.createElement('div');
                particle.classList.add('binary-particle');
                particle.innerText = Math.random() > 0.5 ? '1' : '0';
                
                // Random position around button
                const rect = btn.getBoundingClientRect();
                particle.style.left = `${rect.left + Math.random() * rect.width}px`;
                particle.style.top = `${rect.top + Math.random() * rect.height}px`;
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 1000);
            }
            
            setTimeout(() => btn.classList.remove('glitching'), 300);
        }

        function triggerTypewriter(e) {
            const btn = e.currentTarget;
            
            const symbol = document.createElement('div');
            symbol.classList.add('dropped-symbol');
            symbol.innerText = btn.innerText;
            
            const rect = btn.getBoundingClientRect();
            symbol.style.left = `${rect.left + rect.width/2 - 15}px`;
            symbol.style.top = `${rect.top + rect.height/2 - 15}px`;
            
            document.body.appendChild(symbol);
            setTimeout(() => symbol.remove(), 1500);
        }
    </script>
</body>
</html>
