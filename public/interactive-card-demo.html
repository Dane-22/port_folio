<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Card Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom background color to match typical dark themes */
    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <!-- The Card Container -->
  <div class="relative w-[80vw] max-w-[800px] h-[70vh] rounded-2xl overflow-hidden group shadow-2xl border border-white/10" id="card">
    
    <!-- 1. The Live Iframe (Background) -->
    <!-- We'll use a wikipedia page as a placeholder interactive site -->
    <iframe 
      id="iframe"
      src="https://en.wikipedia.org/wiki/Web_design" 
      class="absolute inset-0 w-full h-full border-none transition-all duration-500 pointer-events-none scale-105 bg-white"
    ></iframe>

    <!-- 2. Dark Gradient Overlay -->
    <div id="overlay" class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/70 to-slate-900/20 transition-opacity duration-500 opacity-100 pointer-events-none"></div>

    <!-- 3. Text Content -->
    <div id="text-content" class="absolute bottom-0 left-0 p-10 transition-all duration-500 opacity-100 translate-y-0 text-white pointer-events-none">
      <div class="flex items-center gap-3 mb-3">
        <span class="text-blue-400 text-xs font-medium tracking-wider uppercase">
          Web Application
        </span>
        <span class="w-1 h-1 rounded-full bg-white/40"></span>
        <span class="text-white/60 text-xs">2024</span>
      </div>
      <h3 class="text-4xl font-bold mb-3 drop-shadow-lg">Sample Project Title</h3>
      <p class="text-white/70 max-w-md">This is a sample description of the project. Notice how it overlays the iframe nicely when not interacting.</p>
    </div>

    <!-- 4. The Interaction Toggle Button -->
    <!-- Button container allows absolute positioning while managing pointer-events properly -->
    <div class="absolute inset-0 pointer-events-none flex" style="z-index: 50;">
      <button 
        id="toggle-btn"
        class="pointer-events-auto absolute bottom-10 right-10 px-6 py-3 rounded-full bg-blue-600 hover:bg-blue-500 text-white font-medium shadow-lg transition-all duration-500"
      >
        Live Preview
      </button>
    </div>

  </div>

  <script>
    let isInteractive = false;
    const toggleBtn = document.getElementById('toggle-btn');
    const iframe = document.getElementById('iframe');
    const overlay = document.getElementById('overlay');
    const textContent = document.getElementById('text-content');

    toggleBtn.addEventListener('click', () => {
      isInteractive = !isInteractive;
      
      if (isInteractive) {
        // Switch to Interactive Mode
        iframe.classList.remove('pointer-events-none', 'scale-105');
        iframe.classList.add('pointer-events-auto', 'scale-100');
        
        overlay.classList.remove('opacity-100');
        overlay.classList.add('opacity-0');
        
        textContent.classList.remove('opacity-100', 'translate-y-0');
        textContent.classList.add('opacity-0', 'translate-y-10');
        
        toggleBtn.textContent = 'Stop Interacting';
        toggleBtn.classList.remove('bottom-10', 'right-10', 'px-6', 'py-3', 'bg-blue-600');
        toggleBtn.classList.add('top-4', 'right-4', 'px-4', 'py-2', 'bg-slate-800/80', 'backdrop-blur-md', 'text-sm');
      } else {
        // Switch to Preview Mode
        iframe.classList.add('pointer-events-none', 'scale-105');
        iframe.classList.remove('pointer-events-auto', 'scale-100');
        
        overlay.classList.add('opacity-100');
        overlay.classList.remove('opacity-0');
        
        textContent.classList.add('opacity-100', 'translate-y-0');
        textContent.classList.remove('opacity-0', 'translate-y-10');
        
        toggleBtn.textContent = 'Live Preview';
        toggleBtn.classList.add('bottom-10', 'right-10', 'px-6', 'py-3', 'bg-blue-600');
        toggleBtn.classList.remove('top-4', 'right-4', 'px-4', 'py-2', 'bg-slate-800/80', 'backdrop-blur-md', 'text-sm');
      }
    });
  </script>
</body>
</html>
